name: Build and deploy portfolio

on:
  push:
    branches:
      - gh-pages
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Assemble source project
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/portfolio-source"
          git worktree add "$source_dir" origin/main

          cp -R src/. "$source_dir/src/"
          cp -R public/. "$source_dir/public/"

          for config_file in package.json package-lock.json tsconfig.json; do
            if [[ -f "$config_file" ]]; then
              cp "$config_file" "$source_dir/$config_file"
            fi
          done

      - name: Build production site
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/portfolio-source"
          npm --prefix "$source_dir" ci
          npm --prefix "$source_dir" run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio-source/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
